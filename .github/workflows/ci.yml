name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend + intelligence (tests, eval, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint (correctness + security rules)
        run: ruff check --isolated --select E,F,B,S --ignore E501,S101 aftermath_intelligence app/agent/real_agent.py scripts
      - name: Tests (no network, no API keys)
        run: pytest -q
      - name: Intelligence eval (100%, no unsafe steps, all stack-frame / history checks)
        run: |
          python scripts/evaluate_intelligence.py | tee eval.txt
          grep -q "unsafe steps: 0" eval.txt
          ! grep -q "^FAIL" eval.txt
          grep -q "extra checks failed: 0" eval.txt

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint
      - name: Unit tests
        run: |
          for f in $(git ls-files '*.test.mjs'); do node --test --experimental-strip-types "$f"; done
      - run: npx next build --webpack
