[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aftermath-intelligence"
version = "0.2.0"
description = "Standalone evidence-driven incident intelligence components for Aftermath"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aftermath_intelligence*"]
